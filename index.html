<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALK BURST｜異世界ギルドのブラック相性＆職種診断</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --card-bg: #262636;
            --accent-color: #d97706;
            --accent-hover: #b45309;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --danger-color: #ef4444;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            color: var(--accent-color);
            font-size: 1.4rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        button:focus-visible, select:focus-visible {
            outline: 2px solid var(--text-main);
            outline-offset: 2px;
        }
        .note {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin: 8px 0 0 0;
        }
        .btn-secondary {
            background-color: #4b5563;
        }
        .btn-secondary:hover {
            background-color: #374151;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            background: #1f1f2e;
            border: 1px solid #4b5563;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
        }
        .question-box {
            background: #1f1f2e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        .q-progress {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: bold;
        }
        .q-text {
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .result-box {
            background: #1f1f2e;
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 6px 6px 0;
        }
        .ad-banner {
            border: 2px dashed #4b5563;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
            border-radius: 6px;
            background: rgba(255,255,255,0.02);
        }
        .my-type-badge {
            display: inline-block;
            background: #374151;
            padding: 4px 10px;
            border-radius: 4px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .stage { border-radius: 10px; padding-top: 10px; text-align: center; border: 3px solid #3a2d4f; margin-bottom: 10px; transition: background .4s; background: #f1dfc0; overflow: hidden; }
        .stage .area { font-size: 0.8rem; font-weight: bold; color: #3a2d4f; }
        .stage svg { display: block; margin: 0 auto; width: 170px; }
        .stage .ground { height: 12px; background: #6b8f4e; border-top: 3px solid #3a2d4f; }
        .track { display: flex; gap: 4px; justify-content: center; margin: 0 0 10px; }
        .track i { width: 14px; height: 14px; background: #3a3a4e; border: 2px solid #555; display: block; }
        .track i.d { background: var(--accent-color); border-color: #fff; }
        .track i.c { background: #fff; border-color: var(--accent-color); }
        @keyframes hopL { 40% { transform: translate(-28px,-14px); } }
        @keyframes hopR { 40% { transform: translate(28px,-14px); } }
        @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .hopL { animation: hopL .3s ease-out; } .hopR { animation: hopR .3s ease-out; } .pop { animation: pop .5s ease-out; }
        @media (prefers-reduced-motion: reduce) { .hopL, .hopR, .pop { animation: none; } }
        @keyframes eh { 0%,100% { transform: translateY(0) scale(1.06,.9); } 50% { transform: translateY(-26px) scale(.95,1.05); } }
        .eg { display: block; margin: 0 auto; transform-origin: 50% 100%; animation: eh .8s ease-in-out infinite; }
        #q-char { padding-top: 30px; } #my-char { padding-top: 8px; }
        .modes { display: flex; gap: 6px; justify-content: center; margin: 0 0 10px; }
        .modes button { width: auto; margin: 0; padding: 6px 14px; font-size: 0.85rem; }
        @media (prefers-reduced-motion: reduce) { .eg { animation: none; } }
        .duo { display: flex; justify-content: center; } .duo svg { width: 140px; }
        .gauge { position: relative; height: 22px; border: 2px solid #555; border-radius: 6px; background: #2a2a3a; margin: 0 0 12px; overflow: hidden; }
        .gauge i { display: block; height: 100%; width: 100%; background: var(--danger-color); }
        .gauge b { position: absolute; inset: 0; text-align: center; font-size: 0.8rem; line-height: 22px; color: #fff; }
        #my-char { min-height: 240px; display: flex; align-items: flex-end; justify-content: center; }
        @keyframes shk { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
        .shake { animation: shk .35s infinite; transform-origin: 50% 100%; } .shake2 { animation: shk .16s infinite; transform-origin: 50% 100%; }
        @keyframes flsh { 0% { filter: brightness(3); } 100% { filter: none; } }
        .flashing { animation: flsh .6s ease-out; }
        @media (prefers-reduced-motion: reduce) { .shake, .shake2, .flashing { animation: none; } }

        /* ---- 画面の崩れ修正（2026-11-15） ---- */
        .nb { display: inline-block; }
        h1, h3 { text-wrap: balance; }
        p, button, .q-text, .note { text-wrap: pretty; }
        .note { margin-bottom: 14px; }
        .row2 { display: flex; gap: 8px; }
        .row2 select { flex: 1; min-width: 0; }
        @media (max-width: 420px) {
            body { padding: 12px; }
            .container { padding: 20px 18px; }
        }
        @media (max-height: 700px) {
            .stage svg { width: 130px; }
            #q-char { padding-top: 22px; }
            .question-box { padding: 14px 16px; margin-bottom: 12px; }
            h1 { margin-bottom: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚔️ <span class="nb">異世界ギルド：</span><span class="nb">ブラック判定所</span> ⚔️</h1>

    <!-- 画面1: メニュー画面 -->
    <div id="screen-menu" class="screen active">
        <p style="text-align: center; color: var(--text-sub);">あなたのギルド職種を判定し、他の冒険者との「限界会話時間」をシニカルに分析します。</p>
        <button onclick="startDiagnosis()">📜 職種診断を始める (全12問)</button>
        <button class="btn-secondary" onclick="showScreen('screen-compat')">👥 直接タイプを選んで相性判定</button>
    </div>

    <!-- 画面2: 診断質問画面 -->
    <div id="screen-quiz" class="screen">
        <div id="stage" class="stage"><div id="q-area" class="area"></div><div id="q-char"></div><div class="ground"></div></div>
        <div id="q-track" class="track"></div>
        <div class="question-box">
            <div id="q-progress" class="q-progress">質問 1 / 12</div>
            <div id="q-text" class="q-text">ここに質問文が入ります</div>
        </div>
        <button onclick="answerQuestion(true)">◀ はい（当てはまる）</button>
        <button class="btn-secondary" onclick="answerQuestion(false)">いいえ（当てはまらない） ▶</button>
    </div>

    <!-- 画面2.5: 孵化前のプロフィール（すべて任意） -->
    <div id="screen-profile" class="screen">
        <h3>🥚 もうすぐ孵化します</h3>
        <p class="note">答えるほど、見た目と称号が細かくなります。どれも「答えたくない」でOK。入力した内容はこの端末の中だけで使われ、送信も保存もされません。</p>
        <label>生まれ年（干支）:</label><select id="p-year"></select>
        <label>誕生月日（星座）:</label><div class="row2"><select id="p-month"></select><select id="p-day"></select></div>
        <label>血液型:</label>
        <select id="p-blood"><option value="">答えたくない</option><option>A</option><option>B</option><option>O</option><option>AB</option></select>
        <label>性別:</label>
        <select id="p-gender"><option value="">答えたくない</option><option value="m">男性</option><option value="f">女性</option><option value="n">どちらでもない</option></select>
        <button onclick="hatch()">🥚 孵化させる</button>
    </div>

    <!-- 画面3: 自分の診断結果表示 -->
    <div id="screen-my-result" class="screen">
        <h3>🎉 あなたの判定職種</h3>
        <div id="hatch-stage" class="stage" style="background:#f1dfc0"><div id="my-char"></div><div class="ground"></div></div>
        <div class="modes"><button class="btn-secondary" onclick="setMode('idle')">待機</button><button class="btn-secondary" onclick="setMode('walk')">歩く</button><button class="btn-secondary" onclick="setMode('run')">走る</button></div>
        <div class="result-box">
            <p><strong>称号:</strong> <span id="my-title" style="font-weight: bold;"></span></p>
            <p><strong>タイプ:</strong> <span id="my-type-code" class="my-type-badge"></span></p>
            <p><strong>ギルド職種:</strong> <span id="my-class-name" style="font-size: 1.2rem; font-weight: bold;"></span></p>
            <p><strong>特徴:</strong> <span id="my-catch"></span></p>
            <p><strong>星座・属性:</strong> <span id="my-extra"></span></p>
        </div>
        <button style="background:#d97706;" onclick="shareCard('my')">📤 結果をシェア（画像）</button>
        <button class="btn-secondary" onclick="window.open(xUrl('my'),'_blank')">𝕏 に文章だけ投稿</button>
        <button onclick="goToCompatWithMyType()">🤝 <span class="nb">他のキャラとの</span><span class="nb">ブラック相性を測る</span></button>
        <button class="btn-secondary" onclick="showScreen('screen-menu')">トップに戻る</button>
    </div>

    <!-- 画面4: 相性チェッカー -->
    <div id="screen-compat" class="screen">
        <h3>👥 パーティー相性査定</h3>
        <label>キャラクター A のタイプ:</label>
        <select id="typeA"></select>

        <label>キャラクター B のタイプ:</label>
        <select id="typeB"></select>

        <label>シチュエーション:</label>
        <select id="situation"></select>

        <button id="btn-compat" onclick="fetchCompatibility()">ブラック査定を実行する</button>
        <button class="btn-secondary" onclick="showScreen('screen-menu')">戻る</button>
    </div>

    <!-- 画面5: 相性査定結果表示 -->
    <div id="screen-result" class="screen">
        <h3>📊 査定結果レポート</h3>
        <div class="stage" style="background:#f1dfc0"><div id="duo" class="duo"></div><div class="ground"></div></div>
        <div class="gauge"><i id="gauge-fill"></i><b id="gauge-label"></b></div>
        <div class="result-box">
            <p><strong>ペア:</strong> <span id="res-pair"></span></p>
            <p><strong>シチュエーション:</strong> <span id="res-situation"></span></p>
            <p><strong>限界会話時間:</strong> <span id="res-time" style="color: var(--danger-color); font-weight: bold;"></span></p>
            <p><strong>ブラック解説:</strong><br><span id="res-comment" style="line-height: 1.6;"></span></p>
            <p id="res-note" class="note"></p>
        </div>

        <div class="ad-banner">
            <p style="font-size: 0.85rem; color: var(--text-sub); margin: 0 0 10px 0;">🎁 広告を見て耐性を強化しますか？</p>
            <p style="font-size: 0.9rem; margin: 0 0 10px 0;"><strong id="res-item"></strong></p>
            <button id="btn-ad" style="background: #059669; margin-top: 0;" onclick="watchAd()"><span class="nb">【動画広告】</span><span class="nb">ポーションを服用する</span> <span class="nb">(+30分延長)</span></button>
        </div>

        <button style="margin-top: 20px; background:#d97706;" onclick="shareCard('compat')">📤 査定結果をシェア（画像）</button>
        <button class="btn-secondary" onclick="window.open(xUrl('compat'),'_blank')">𝕏 に文章だけ投稿</button>
        <button style="margin-top: 8px;" onclick="showScreen('screen-compat')">別のペアを査定する</button>
    </div>
</div>

<script>
    // ★GASのウェブアプリURL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyw59yeryhjg6oir3i5jRvdxX1uze8B-SLpwXNe_mkBFdK5x9Zj9mJNKdFtwkw0qZAc/exec";
    const FETCH_TIMEOUT_MS = 10000;
    const AD_BONUS_MINUTES = 30;

    // ---------- フォールバック用マスターデータ（GAS取得失敗時もこれで動く） ----------
    const DEFAULT_CHARACTERS = {
        "INTJ": { name: "魔導戦略士", catch: "論理・計画・洞察" },
        "INTP": { name: "理論魔導士", catch: "分析・探究・抽象思考" },
        "ENTJ": { name: "ギルド統率者", catch: "決断・統率・効率" },
        "ENTP": { name: "からくり発明家", catch: "創造・議論・柔軟" },
        "INFJ": { name: "星読みの提唱者", catch: "洞察・共感・理想" },
        "INFP": { name: "精霊の仲介者", catch: "優しさ・価値観・創造" },
        "ENFJ": { name: "伝説の勇者", catch: "調整・共感・導く力" },
        "ENFP": { name: "精霊使い", catch: "情熱・創造・自由" },
        "ISTJ": { name: "ギルド管理者", catch: "誠実・規律・実務力" },
        "ISFJ": { name: "聖騎士の擁護者", catch: "献身・丁寧・支援" },
        "ESTJ": { name: "鉄血の統率者", catch: "秩序・効率・管理" },
        "ESFJ": { name: "宴の司会者", catch: "社交・調整・気配り" },
        "ISTP": { name: "魔導機巧師", catch: "冷静・実践・柔軟" },
        "ISFP": { name: "放浪の冒険家", catch: "感性・自由・優しさ" },
        "ESTP": { name: "疾風の起業家", catch: "行動・瞬発・社交" },
        "ESFP": { name: "吟遊詩人", catch: "明るさ・柔軟・社交" }
    };

    // pos = 「はい」で加点される側 / neg = 「いいえ」で加点される側（シートの weight_positive / weight_negative と同じ意味）
    const DEFAULT_QUESTIONS = [
        { text: "パーティーの宴会では自分から積極的に話しかけるほうだ", pos: "E", neg: "I" },
        { text: "大勢で過ごすより、一人の時間でエネルギーを充電したい", pos: "I", neg: "E" },
        { text: "初対面の相手ともすぐに会話を盛り上げることができる", pos: "E", neg: "I" },
        { text: "具体的な事実や目の前のデータを何よりも信用する", pos: "S", neg: "N" },
        { text: "未来の可能性や抽象的なアイデアを考えるのが好きだ", pos: "N", neg: "S" },
        { text: "現実的な手順よりも、全体のコンセプトや意味を重視する", pos: "N", neg: "S" },
        { text: "感情や人間関係よりも、客観的な論理と法則で決断する", pos: "T", neg: "F" },
        { text: "他人の気持ちに共感し、調和を保つことが何より大切だ", pos: "F", neg: "T" },
        { text: "問題が起きた時、情を挟まずに事実に基づいた効率的解決を選ぶ", pos: "T", neg: "F" },
        { text: "旅の計画はあらかじめきっちり立てて行動したい", pos: "J", neg: "P" },
        { text: "状況に応じて臨機応変に柔軟な対応をする方が得意だ", pos: "P", neg: "J" },
        { text: "締め切りや約束事は必ず厳守する計画派だ", pos: "J", neg: "P" }
    ];

    const DEFAULT_SITUATIONS = [
        { id: "1", name: "通常の酒場での雑談", locked: false },
        { id: "2", name: "修羅場のデスマーチ炎上編", locked: true },
        { id: "3", name: "初デートのぎこちないカフェ", locked: false },
        { id: "4", name: "飲み会の幹事決め", locked: false },
        { id: "5", name: "満席の新幹線・隣の席", locked: true },
        { id: "6", name: "家族LINEの返信地獄", locked: false }
    ];

    const AXIS_GROUPS = ["EI", "SN", "TF", "JP"];

    // ---------- 状態 ----------
    let characters = JSON.parse(JSON.stringify(DEFAULT_CHARACTERS));
    let questions = DEFAULT_QUESTIONS.slice();
    let situations = DEFAULT_SITUATIONS.slice();
    const unlockedSituations = new Set();

    let currentQIndex = 0;
    let scores = {};
    let lastPick = {};
    let myCalculatedType = "INTJ";
    let currentLimit = 0;
    let adUsed = false;

    // ---------- 起動 ----------
    window.onload = async () => {
        initSelectOptions();
        initSituationOptions();
        initProfile();
        await loadMasterData();      // 成功すればシートの内容で上書き、失敗してもそのまま動く
        initSelectOptions();
        initSituationOptions();
    };

    function showScreen(screenId) {
        if (screenId !== 'screen-my-result' && typeof heroTimer !== 'undefined') clearInterval(heroTimer);
        if (screenId !== 'screen-my-result' && typeof hatchTimers !== 'undefined') hatchTimers.forEach(clearTimeout);
        if (screenId !== 'screen-result' && typeof cmpTimer !== 'undefined') clearInterval(cmpTimer);
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // ---------- GAS通信 ----------
    async function gasFetch(params) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
        try {
            const res = await fetch(GAS_API_URL + "?" + new URLSearchParams(params), { signal: ctrl.signal });
            if (!res.ok) throw new Error("HTTP " + res.status);
            return await res.json();
        } finally {
            clearTimeout(timer);
        }
    }

    async function loadMasterData() {
        try {
            const d = await gasFetch({ action: "getBootstrap" });
            if (!d || d.status === "error") throw new Error(d && d.message || "bootstrap failed");
            applyMasterData(d);
        } catch (e) {
            console.warn("マスターデータ取得失敗。内蔵データで動作します:", e);
        }
    }

    // シートの内容を検証してから採用（不完全なら内蔵データを維持）
    function applyMasterData(d) {
        if (Array.isArray(d.characters)) {
            d.characters.forEach(r => {
                const code = String(r.mbti_type || "").trim().toUpperCase();
                if (characters[code] && r.class_name) {
                    characters[code] = {
                        name: String(r.class_name),
                        catch: r.catch_phrase ? String(r.catch_phrase) : characters[code].catch
                    };
                }
            });
        }
        if (Array.isArray(d.questions)) {
            const valid = d.questions
                .filter(r => r.question_text && r.weight_positive && r.weight_negative)
                .map(r => ({ text: String(r.question_text), pos: String(r.weight_positive).trim().toUpperCase(), neg: String(r.weight_negative).trim().toUpperCase() }));
            // 4軸すべてに2問以上あるときだけ採用
            const ok = AXIS_GROUPS.every(g => valid.filter(q => g.includes(q.pos)).length >= 2);
            if (ok) questions = valid;
        }
        if (Array.isArray(d.situations)) {
            const valid = d.situations
                .filter(r => r.situation_id !== "" && r.situation_name)
                .map(r => ({ id: String(r.situation_id), name: String(r.situation_name), locked: String(r.is_locked_by_ad).toUpperCase() === "TRUE" }));
            if (valid.length > 0) {   // 内蔵の定義にシートの内容を上書きして統合（シートは名前・ロック設定の調整用）
                const m = new Map(DEFAULT_SITUATIONS.map(s => [s.id, s]));
                valid.forEach(s => m.set(s.id, s));
                situations = [...m.values()];
            }
        }
    }

    // ---------- セレクト初期化（textContentで安全に生成） ----------
    function initSelectOptions() {
        const selectA = document.getElementById('typeA');
        const selectB = document.getElementById('typeB');
        const keepA = selectA.value, keepB = selectB.value;
        selectA.innerHTML = '';
        selectB.innerHTML = '';

        for (const code in characters) {
            const label = `${code}（${characters[code].name}）`;
            [selectA, selectB].forEach(sel => {
                const o = document.createElement('option');
                o.value = code;
                o.textContent = label;
                sel.appendChild(o);
            });
        }
        selectA.value = keepA || "INTJ";
        selectB.value = keepB || "ENFP";
    }

    function initSituationOptions() {
        const sel = document.getElementById('situation');
        const keep = sel.value;
        sel.innerHTML = '';
        situations.forEach(s => {
            const o = document.createElement('option');
            o.value = s.id;
            const locked = s.locked && !unlockedSituations.has(s.id);
            o.textContent = (locked ? "🔒 " : "") + s.name;
            sel.appendChild(o);
        });
        if (keep && situations.some(s => s.id === keep)) sel.value = keep;
    }

    // ---------- 診断 ----------
    function startDiagnosis() {
        currentQIndex = 0;
        hopNext = "";
        scores = {};

    function answerQuestion(isYes) {
        const q = questions[currentQIndex];
        const picked = isYes ? q.pos : q.neg;
        scores[picked] = (scores[picked] || 0) + 1;
        const group = AXIS_GROUPS.find(g => g.includes(q.pos));
        lastPick[group] = picked;          // 同点のとき「最後に選んだ側」を採用
        hopNext = isYes ? "hopL" : "hopR";

        currentQIndex++;
        if (currentQIndex < questions.length) {
            renderQuestion();
        } else {
            calculateTypeResult();
        }
    }

    function calculateTypeResult() {
        // 各軸: 得点が多い方。同点なら最後に選んだ方（常に同じ側に偏らない）
        const pick = g => {
            const a = scores[g[0]] || 0, b = scores[g[1]] || 0;
            return a === b ? (lastPick[g] || g[0]) : (a > b ? g[0] : g[1]);
        };
        myCalculatedType = AXIS_GROUPS.map(pick).join("");
        const charInfo = characters[myCalculatedType] || characters["INTJ"];

        document.getElementById('my-type-code').innerText = myCalculatedType;
        document.getElementById('my-class-name').innerText = charInfo.name;
        document.getElementById('my-catch').innerText = charInfo.catch;

        showScreen('screen-profile');
    }

    function goToCompatWithMyType() {
        document.getElementById('typeA').value = myCalculatedType;
        showScreen('screen-compat');
    }


    // ---------- ブラック相性エンジン（シート未登録のペアを自動で査定） ----------
    const LEGACY_FALLBACK = "お互いに無関心すぎて、逆に永遠に会話が平行線をたどるミステリー空間。";
    // [会話中にやること, 地雷（苦手なもの）, 特効薬]
    const TALK = {
        INTJ: ["三手先の結論から話し始める", "目的のない雑談", "戦略眼のモノクル"],
        INTP: ["話の途中で言葉の定義を確認し始める", "「とりあえず」で進む会議", "禁断の脚注の書"],
        ENTJ: ["会話を議事録の形式で進行する", "決まらない沈黙", "即断の軍配"],
        ENTP: ["反論のためだけに反対側へ回る", "「前例通り」の一言", "屁理屈の永久機関"],
        INFJ: ["言葉の裏の裏まで読んで黙り込む", "本音の見えない愛想笑い", "星読みの静寂の水晶"],
        INFP: ["急に自分の世界観を語り出す", "数字だけで語られる評価", "夢見の毛布"],
        ENFJ: ["全員が話せるよう勝手に司会を始める", "ひとり黙り込んだままの人", "勇者の励ましの旗"],
        ENFP: ["三つ前の話題に急に戻る", "同じ話の繰り返し", "気まぐれ花火セット"],
        ISTJ: ["前回の約束を日付つきで読み上げる", "その場のノリで変わる予定", "整頓の羊皮紙"],
        ISFJ: ["さりげなく全員分のお茶を用意する", "「やって当然」という空気", "手作りの癒やしクッキー"],
        ESTJ: ["雑談にも期限と担当者を決める", "やる気のない「たぶん」", "鉄の進行表"],
        ESFJ: ["誰かの近況に全員を巻き込む", "ひとりだけ置いていかれた空気", "宴の乾杯の杯"],
        ISTP: ["相づちを打たずに道具を見つめる", "感情の説明会", "万能ドライバー"],
        ISFP: ["話の途中で窓の外の猫を見つける", "分刻みのスケジュール", "旅人の木漏れ日の栞"],
        ESTP: ["結論が出る前に実行を始める", "長すぎる前置き", "疾風のエナジードリンク"],
        ESFP: ["ネタを挟みすぎて本題を見失う", "盛り上がりの足りない空気", "吟遊詩人のリュート"]
    };
    const TPL = {
        high: [
            "{A}が{aAct}と、{B}は{bMine}を前にしたような顔になる。そこへ{B}が{bAct}ので、会話は着地点を失った。",
            "{A}は{aAct}。{B}は{bAct}。ここまでは良い。問題は、{A}が{aMine}を、{B}が{bMine}を何より嫌うこと。互いの地雷を、的確に踏み合っている。",
            "{B}が{bAct}間、{A}は{aMine}を思い出して遠い目をしている。会話ではなく、もはや異文化交流。",
            "{A}が{aAct}たび、{B}の理性ゲージが削れていく。{B}は{bAct}ことで反撃するが、完全に逆効果。"
        ],
        mid: [
            "{A}が{aAct}と、{B}は一応うなずく。しかし{B}が{bAct}と、今度は{A}が{aMine}を見た顔になる。互いに我慢の交代制。",
            "{A}と{B}は会話のテンポが半拍ずれている。{A}は{aAct}、{B}は{bAct}。笑っているが、目は少し死んでいる。",
            "悪くはない。でも{A}が{aMine}を避け、{B}が{bMine}を避けるうち、話題が天気と近所の猫だけになる。",
            "{B}が{bAct}と、{A}も負けじと{aAct}。キャッチボールのはずが、お互い別の球で遊んでいる。"
        ],
        low: [
            "{A}が{aAct}。{B}が{bAct}。これが奇跡的に噛み合い、気づけば終電も朝日も通り過ぎている。",
            "{A}と{B}は{aMine}も{bMine}も笑い飛ばせる戦友。問題は、楽しすぎて会話の終え方を誰も知らないこと。",
            "{A}が{aAct}と、{B}はすでに同じことを考えていた。話が早すぎて、周囲だけが置いていかれる。",
            "{A}が{aAct}のに、{B}が{bAct}ので、周りの人は会話に入れず、静かに席を移動する。"
        ],
        same: [
            "{A}同士。二人とも{aAct}ので、同時に話し始めて同時に黙る。{aMine}が出た瞬間だけ息ぴったり。",
            "鏡に向かって喋っているのと同じ。{aAct}癖が二人分そろい、会話の終わりは永遠に来ない。",
            "お互いの考えが分かりすぎて、{aAct}たびに「それ私も思ってた」が渋滞する。{aMine}にだけは、二人とも勝てない。"
        ]
    };
    const ENDS = {
        high: ["（周囲の証言：二人の間だけ気圧が違った）", "（解散後、二人とも同じ場所で深呼吸をした）", "（ギルド掲示板に「あの席は避けろ」の貼り紙が出た）"],
        mid: ["（解散後、それぞれ別の人に愚痴を言って満足した）", "（帰り道、二人とも「悪い人じゃない」と三回言った）", "（次の約束は、なぜか二人とも「また今度」で一致した）"],
        low: ["（翌朝、お互いの寝落ち通話が履歴に残っていた）", "（解散の挨拶だけで、さらに二十分かかった）", "（周囲の人は静かに会計を済ませた）"]
    };
    ENDS.same = ENDS.low;
    // シチュエーション別：限界時間の補正と、結論に添えるオチ（[ズレ大, 中, 小]）
    const SIT_F = { "2": 0.5, "3": 0.8, "4": 0.9, "5": 0.6, "6": 1.3 };
    const SIT_END = {
        "2": { high: ["（その夜、サーバーより先に二人の会話が落ちた）", "（障害報告書の原因欄に「会話」と書かれた）"],
               mid: ["（復旧作業より、お互いの言い方への指摘が長引いた）", "（深夜二時、チャットだけが妙に丁寧になった）"],
               low: ["（徹夜明け、二人だけ妙にテンションが高かった）", "（炎上が鎮火したのに、二人の雑談だけ燃え続けた）"] },
        "3": { high: ["（会計の瞬間、二人とも財布を探すふりをして時間が止まった）", "（解散後、お互い「楽しかったです」の文面を三十分推敲した）"],
               mid: ["（別れ際の「また連絡します」が、どちらの本心かは永遠の謎）", "（帰りの電車で、二人とも今日の自分の発言を反省した）"],
               low: ["（予定の二時間が、気づけば六時間になっていた）", "（店員さんが閉店を言い出せず、遠くで見守っていた）"] },
        "4": { high: ["（結局、欠席者が幹事に決まった）", "（幹事決めだけで、飲み会の予算が溶けた）"],
               mid: ["（二人でじゃんけんをしたが、三回あいこが続いた）", "（最終的に「会場は後で決めよう」で解散した）"],
               low: ["（意気投合して、二人で幹事を引き受け会場を二つ予約した）", "（幹事が決まった瞬間、二人とも二次会の話を始めていた）"] },
        "5": { high: ["（車内アナウンスが、救いの女神に聞こえた）", "（名古屋で二人とも降りたふりをして立ち上がった）"],
               mid: ["（二人とも、寝たふりが上達した）", "（静岡あたりで会話が尽き、ずっと富士山の話をしていた）"],
               low: ["（新大阪に着く頃には、旅行の予定が三つ増えていた）", "（降りるとき、二人とも「あれ、もう着いた？」と言った）"] },
        "6": { high: ["（既読スルーという名の最終兵器が発動した）", "（返信が来たのは、三日後のスタンプ一個だった）"],
               mid: ["（「了解」のスタンプだけが、静かに行き交った）", "（既読は付いたが、返信は付かなかった）"],
               low: ["（通知が止まらず、スマホが熱を持った）", "（ついでに祖母のグループLINEにも拡散された）"] }
    };
    // 名物ペアは手書き（{ISTJ} のように書くと、そのタイプの職種名が入る）
    const SPECIAL = {
        "ENFP-ISTJ": "{ISTJ}の「前回は火曜の十四時と決まっています」に、{ENFP}の「え、そうだっけ？ でもさ！」が襲いかかる。議事録対気分、この勝負に判定は存在しない。",
        "ESTJ-INFP": "{ESTJ}が「で、期限は？」と聞くたび、{INFP}の精霊が一匹ずつ逃げていく。五匹目で、{INFP}は静かに窓の外を見た。",
        "ENTP-ISTJ": "{ENTP}が「逆に、そのルールの意味は？」と言った瞬間、{ISTJ}の背後で規則書が三冊同時に開いた。",
        "ESFJ-INTP": "{ESFJ}の「みんなで話そう！」に、{INTP}は「みんなとは誰の集合ですか」と定義を求めた。宴は静かに終わった。",
        "ENTJ-ENTJ": "{ENTJ}同士。議題が決まる前に議長が二人立ち、採決の前に両方が可決した。誰も従わないので、ギルドが二つできた。",
        "ESTP-INFJ": "{ESTP}が実行に移した頃、{INFJ}はまだ三日前の一言の真意を読んでいた。同じ時間を、違う世界で過ごしている。",
        "ENFJ-ISTP": "{ENFJ}の「みんなで楽しもう！」に、{ISTP}は黙って工具を握った。励ましが響く前に、椅子が一つ直った。",
        "ESFP-INTJ": "{ESFP}の渾身のネタに、{INTJ}は「それの結論は？」と返した。笑いの神様が、静かに席を立った。",
        "ENTP-ISFJ": "{ENTP}の屁理屈に、{ISFJ}はにこにこしながらお茶を出した。反論の勢いは、湯気の中に消えていった。"
    };
    const AX_W = [["E","I",1],["S","N",3],["T","F",3],["J","P",2]];   // 会話のズレに効く重み（S/N・T/Fが大きい）
    function hashStr(s) { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; return h; }
    function mismatchW(a, b) {
        return AX_W.reduce((w, x) => w + ((a.includes(x[0]) ? x[0] : x[1]) !== (b.includes(x[0]) ? x[0] : x[1]) ? x[2] : 0), 0);
    }
    function tailOf(tier, sitId, h) {
        const s = SIT_END[String(sitId)], k = tier === "same" ? "low" : tier;
        return s ? s[k][(h >>> 3) % 2] : ENDS[tier][(h >>> 3) % 3];
    }
    function genCompat(a, b, sitId) {
        const h = hashStr([a, b].sort().join("-"));    // 順番を入れ替えても同じ査定になる
        const w = mismatchW(a, b);
        const tier = a === b ? "same" : w >= 6 ? "high" : w >= 3 ? "mid" : "low";
        let lim = Math.max(5, 60 - w * 6 + (h % 7) - 3);
        lim = Math.max(3, Math.round(lim * (SIT_F[String(sitId)] || 1)));   // シチュエーション補正
        const tpl = SPECIAL[[a, b].sort().join("-")] || TPL[tier][h % TPL[tier].length];
        const [aAct, aMine, aItem] = TALK[a], [bAct, bMine, bItem] = TALK[b];
        const nm = t => (characters[t] || { name: t }).name;
        const val = { A: nm(a), B: nm(b), aAct, bAct, aMine, bMine };
        Object.keys(TALK).forEach(k => { val[k] = nm(k); });
        const text = tpl.replace(/\{(\w+)\}/g, (_, k) => val[k]) + tailOf(tier, sitId, h);
        return { limit_minutes: lim, black_comment: text, recovery_item: `${(h >>> 5) % 2 ? aItem : bItem}（動画視聴）`, is_generated: true };
    }

    // ---------- 相性画面の演出：向かい合う2体＋限界ゲージ ----------
    let cmpTimer = null, cmpT = 0, cmpPair = null;
    function startCompatScene(a, b, limit) {
        clearInterval(cmpTimer); cmpPair = [a, b]; cmpT = 0;
        const cfg = t => ({ t, aura: LIGHT_TYPES.includes(t) ? AUR.light[1] : AUR.dark[1], gender: "", blood: "", eto: null });
        const cA = cfg(a), cB = cfg(b), t0 = Date.now(), DUR = 5000;
        const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const draw = () => {
            const pct = reduce ? 0 : Math.max(0, 1 - (Date.now() - t0) / DUR);
            const mode = pct > 0.5 ? "idle" : pct > 0 ? "walk" : "run";   // ゲージが減るほど落ち着きを失い、最後は逃走
            document.getElementById('duo').innerHTML = `<div>${heroSvg(cA, cmpT, mode, false)}</div><div style="transform:scaleX(-1)">${heroSvg(cB, cmpT, mode, false)}</div>`;
            document.getElementById('gauge-fill').style.width = (pct * 100) + "%";
            document.getElementById('gauge-label').innerText = pct > 0 ? `残り ${Math.ceil(limit * pct)} 分` : "限界会話時間 到達！";
        };
        draw();
        if (!reduce) cmpTimer = setInterval(() => { cmpT++; draw(); }, 140);
    }

    // ---------- 相性査定 ----------
    function localFallback(typeA, typeB, situationId) {
        return {
            type_a: typeA, type_b: typeB, situation_id: situationId,
            limit_minutes: 15,
            black_comment: "お互いに無関心すぎて、逆に永遠に会話が平行線をたどるミステリー空間。",
            recovery_item: "観察眼の片眼鏡（動画視聴）",
            is_fallback: true
        };
    }

    async function fetchCompatibility() {
        const typeA = document.getElementById('typeA').value;
        const typeB = document.getElementById('typeB').value;
        const sitId = document.getElementById('situation').value;
        const sit = situations.find(s => s.id === sitId) || situations[0];

        // 広告ロック中のシチュエーションは、広告視聴（デモ）で解放
        if (sit.locked && !unlockedSituations.has(sit.id)) {
            if (!confirm(`「${sit.name}」は広告視聴で解放されます。\n【デモ】15秒の動画広告を見ますか？`)) return;
            unlockedSituations.add(sit.id);
            initSituationOptions();
            document.getElementById('situation').value = sit.id;
        }

        const btn = document.getElementById('btn-compat');
        btn.disabled = true;
        btn.innerText = "査定中…（初回は数秒かかります）";

        let data, offline = false;
        try {
            data = await gasFetch({ action: "getCompatibility", typeA, typeB, situation: sitId });
            if (!data || data.status === "error") throw new Error(data && data.message || "compat failed");
        } catch (e) {
            console.error(e);
            data = { is_fallback: true };
            offline = true;
        } finally {
            btn.disabled = false;
            btn.innerText = "ブラック査定を実行する";
        }

        // シートに登録がなければ、相性エンジンで自動査定
        let generated = false;
        if (offline || data.is_fallback || data.black_comment === LEGACY_FALLBACK) { data = genCompat(typeA, typeB, sitId); generated = true; }

        currentLimit = Number(data.limit_minutes) || 15;
        adUsed = false;

        const nameA = characters[typeA] ? characters[typeA].name : "";
        const nameB = characters[typeB] ? characters[typeB].name : "";
        document.getElementById('res-pair').innerText = `${typeA}（${nameA}） × ${typeB}（${nameB}）`;
        document.getElementById('res-situation').innerText = sit.name;
        document.getElementById('res-time').innerText = `${currentLimit} 分`;
        document.getElementById('res-comment').innerText = data.black_comment;
        document.getElementById('res-item').innerText = `特効薬: ${data.recovery_item}`;
        document.getElementById('res-note').innerText =
            offline ? "※ 通信できなかったため、ブラック相性エンジンで自動査定しました。"
            : generated ? "※ ブラック相性エンジンによる自動査定です。" : "";

        const adBtn = document.getElementById('btn-ad');
        adBtn.disabled = false;
        adBtn.innerText = `【動画広告】ポーションを服用する (+${AD_BONUS_MINUTES}分延長)`;

        shareData.compat = { a: typeA, b: typeB, nameA: nameA, nameB: nameB, sitName: sit.name, comment: data.black_comment, item: data.recovery_item };
        showScreen('screen-result');
        startCompatScene(typeA, typeB, currentLimit);
    }

    function watchAd() {
        if (adUsed) return;
        adUsed = true;
        currentLimit += AD_BONUS_MINUTES;   // 元の時間に加算（固定の45分ではない）
        alert(`【デモ】15秒の動画広告再生完了！ 会話時間が${AD_BONUS_MINUTES}分延長され、相手の脳内マニュアルが解放されました。`);
        document.getElementById('res-time').innerText = `${currentLimit} 分 (ポーション効果発動中)`;
        const adBtn = document.getElementById('btn-ad');
        adBtn.disabled = true;
        adBtn.innerText = "ポーション服用済み";
        if (cmpPair) startCompatScene(cmpPair[0], cmpPair[1], currentLimit);
    }
